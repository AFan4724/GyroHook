name: Build Kernel Modules

on:
  workflow_call:
    inputs:
      kmi:
        required: true
        type: string
      ddk_release:
        required: false
        type: string
        default: '20260313'

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build module in DDK container
        run: |
          set -e
          IMAGE="ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/kernel" \
            "$IMAGE" \
            sh -c "make CC=clang"

      - name: Prepare artifact
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp kernel/gyrohook.ko "$GITHUB_WORKSPACE/out/${{ inputs.kmi }}_gyrohook.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/out/${{ inputs.kmi }}_gyrohook.ko"

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kmi }}-lkm
          path: out/${{ inputs.kmi }}_gyrohook.ko
          if-no-files-found: error
          retention-days: 7
